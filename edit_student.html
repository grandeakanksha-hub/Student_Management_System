<!DOCTYPE html>
<html>
<head>

<title>Edit Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

<div class="card shadow p-4">

<h3>Edit Student</h3>

<form method="POST">

<div class="row">

<div class="col-md-6">
<label>Name</label>
<input class="form-control" name="name" value="{{student.name}}">
</div>

<div class="col-md-6">
<label>Email</label>
<input class="form-control" name="email" value="{{student.email}}">
</div>

<div class="col-md-6 mt-3">
<label>Department</label>
<input class="form-control" name="department" value="{{student.department}}">
</div>

<div class="col-md-6 mt-3">
<label>Year</label>
<input class="form-control" name="year" value="{{student.year}}">
</div>

<div class="col-md-6 mt-3">
<label>Marks</label>
<input class="form-control" name="marks" value="{{student.marks}}">
</div>

<div class="col-md-6 mt-3">
<label>Attendance</label>
<input class="form-control" name="attendance" value="{{student.attendance}}">
</div>

</div>

<button class="btn btn-warning mt-4">Update</button>

</form>

</div>

</div>

</body>

</html>
