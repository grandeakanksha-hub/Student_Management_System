<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="{{ url_for('dashboard') }}">

            Student Management System

        </a>


        <a
            href="{{ url_for('logout') }}"
            class="btn btn-outline-light">

            Logout

        </a>

    </div>

</nav>



<!-- ================= DASHBOARD ================= -->

<div class="container mt-5">


    <h2 class="mb-4">
        Dashboard
    </h2>



    <!-- ================= STATISTICS BOXES ================= -->

    <div class="row g-4">


        <!-- Total Students -->

        <div class="col-md-6 col-lg-3">

            <div class="card shadow dashboard-stat-card h-100">

                <div class="card-body text-center">

                    <h5 class="text-muted">
                        Total Students
                    </h5>

                    <h1 class="fw-bold">
                        {{ total }}
                    </h1>

                </div>

            </div>

        </div>



        <!-- CSE Students -->

        <div class="col-md-6 col-lg-3">

            <div class="card shadow dashboard-stat-card h-100">

                <div class="card-body text-center">

                    <h5 class="text-muted">
                        CSE Students
                    </h5>

                    <h1 class="fw-bold">
                        {{ cse_count }}
                    </h1>

                </div>

            </div>

        </div>



        <!-- Average Marks -->

        <div class="col-md-6 col-lg-3">

            <div class="card shadow dashboard-stat-card h-100">

                <div class="card-body text-center">

                    <h5 class="text-muted">
                        Average Marks
                    </h5>

                    <h1 class="fw-bold">
                        {{ avg_marks }}
                    </h1>

                </div>

            </div>

        </div>



        <!-- Average Attendance -->

        <div class="col-md-6 col-lg-3">

            <div class="card shadow dashboard-stat-card h-100">

                <div class="card-body text-center">
                    <h5 class="text-muted">
                            Average Attendance
                    </h5>

                    <h1 class="fw-bold">
                        {{ avg_attendance }}%
                    </h1>

                </div>
            </div>

        </div>

    </div>



    <!-- ================= BUTTONS ================= -->
    <br>
    <h1>Quick Actions</h1>
    <div class="mt-4">

        <a
            href="{{ url_for('students') }}"
            class="btn btn-primary">

            View Students

        </a>


        <a
            href="{{ url_for('add_student') }}"
            class="btn btn-success">

            Add Student

        </a>
    </div>
</div>


</body>

</html>
