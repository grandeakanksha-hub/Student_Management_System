<!DOCTYPE html>
<html>
<head>

<title>Add Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-4">

<div class="card shadow p-4">

<h3>Add Student</h3>

<form method="POST">

<div class="row">

<div class="col-md-6">
<label>Name</label>
<input class="form-control" name="name" required>
</div>

<div class="col-md-6">
<label>Email</label>
<input class="form-control" name="email" required>
</div>

<div class="col-md-6 mt-3">
<label>Department</label>
<select class="form-select" name="department">
<option>CSE</option>
<option>ECE</option>
<option>AI</option>
<option>DS</option>
<option>IT</option>
</select>
</div>

<div class="col-md-6 mt-3">
<label>Year</label>
<select class="form-select" name="year">
<option value="1">1st</option>
<option value="2">2nd</option>
<option value="3">3rd</option>
<option value="4">4th</option>
</select>
</div>

<div class="col-md-6 mt-3">
<label>Marks</label>
<input type="number" class="form-control" name="marks">
</div>

<div class="col-md-6 mt-3">
<label>Attendance</label>
<input type="number" class="form-control" name="attendance">
</div>

</div>

<button class="btn btn-success mt-4">Save Student</button>

<a href="{{url_for('students')}}" class="btn btn-secondary mt-4">Cancel</a>

</form>

</div>

</div>

</body>

</html>
